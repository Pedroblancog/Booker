# Definición del proyecto para XcodeGen.
# Tras añadir o mover archivos, regenera el .xcodeproj con: xcodegen generate
name: Booker
options:
  bundleIdPrefix: com.pedroblanco
  developmentLanguage: es
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Booker:
    type: application
    platform: iOS
    sources:
      - path: Booker
    info:
      path: Booker/Info.plist
      properties:
        CFBundleDisplayName: Booker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Canvas
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pedroblanco.booker
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
